<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kaua-pagina-web</title>
    <style>
        header {
            background-color: #061C3E;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main {
            background-color: #FFFFFF;
            color: #061C3E;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }
        
        img {
            width: 80px;
            height: 80px;
        }
        .artigo-autor {
            font-weight: bold;
        }
        article {
            display: flex;
        }
    </style>
</head>
<body>
    <header>
        <h1></h1>
        <p class="artigo-autor">por: kaua matheus munis dallassenta</p>
    </header>
    <main>
        <article>
            <img src="imagem.blog.png" alt="imagem de publicidade">
            <div>
                <h2>em primeiro post</h2>
                <p class="artigo-autor">por: kaua matheus munis dallassenta</p>
                <p></p>
                <button>♥️<span>0</span></button>
                <button>👍🏻<span>0</span></button>
            </div>
        </article>
        <article>
            <img src="imagem.blog.png" alt="imagem de publicidade">
            <div>
                <h2>em segundo post</h2>
                <p class="artigo-autor">por: kaua matheus munis dallassenta</p>
                <p></p>
                <button>♥️<span>0</span></button>
                <button>👍🏻<span>0</span></button>
            </div>
        </article>
    </main>
</body>
    <script>
        const botoes = document.querySelectorAll("button");
        botoes.forEach(function (botao) {
            let curtiu = false;
            botao.addEventListener("click", botaoClicado);
            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            }
        })
    </script>
</body>
</html>
